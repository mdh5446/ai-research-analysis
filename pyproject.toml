[project]
name = "ai-research-analysis"
version = "0.1.0"
description = "Local AI-assisted Korean stock market research"
readme = "README.md"
authors = [
    { name = "mdh5446", email = "77725088+mdh5446@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "openai>=3.24.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.3",
    "streamlit>=1.65.0",
]

[project.scripts]
ai-research-analysis = "ai_research_analysis:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv.build-backend]
module-name = ["ai_research_analysis", "stock_research"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py314"
